<!-- ===== روتین شب: این کل بلاک رو درست قبل از </body> (بعد از آخرین </script>) بچسبون ===== -->
<style>
.nrc{overflow:hidden}
.nrc:before{content:"";position:absolute;inset:-30% -20% auto auto;width:260px;height:260px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--tog) 38%,transparent),transparent);pointer-events:none;animation:float 7s ease-in-out infinite alternate}
.nrbar{position:relative;height:10px;border-radius:9px;background:rgba(255,255,255,.1);margin:2px 0 14px;overflow:hidden}
.nrbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--ac),var(--tog),#FFC27A);box-shadow:0 0 16px var(--tog);transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.nrr{gap:12px;position:relative}
.nre{flex:none;width:42px;height:42px;display:grid;place-items:center;border-radius:15px;font-size:20px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);transition:.3s}
.nre .ico{margin:0;background:none;box-shadow:none;width:24px;height:24px}
.nrr.done .nre{background:color-mix(in srgb,var(--ac) 28%,transparent);box-shadow:0 0 18px -4px var(--ac),inset 0 0 0 1px var(--ac)}
.nrdone{margin-top:12px;text-align:center;padding:16px;border-radius:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 30%,transparent),color-mix(in srgb,var(--tog) 30%,transparent));box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);animation:rv .7s both}
.nrdone span{display:block;font-size:26px;color:#FFE9A8;text-shadow:0 0 18px #FFD36B}
.nrdone b{display:block;font:400 22px/1.6 Lalezar,Vazirmatn,sans-serif}
.nrdone small{display:block;font-size:12.5px;opacity:.85;line-height:1.8}
.tpc h2 small{background:rgba(255,255,255,.12);color:var(--tx)}
.tps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tp{--t:var(--ac);padding:14px 12px;border-radius:22px;background:linear-gradient(160deg,color-mix(in srgb,var(--t) 24%,transparent),color-mix(in srgb,var(--t) 6%,transparent));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--t) 40%,transparent)}
.tp i{font-style:normal;display:grid;place-items:center;width:38px;height:38px;margin-bottom:8px;border-radius:13px;font-size:19px;background:color-mix(in srgb,var(--t) 35%,transparent);box-shadow:0 8px 16px -8px var(--t)}
.tp b{display:block;font-size:14px;font-weight:800;margin-bottom:3px}
.tp small{display:block;font-size:12px;line-height:1.8;color:var(--mut)}
</style>
<script>
(function(){
const NR=[['🪥','مسواک زدن (شب)'],['🧴','شستن صورت و مراقبت از پوست'],['💧','یه لیوان آب کوچیک قبل خواب'],['🍵','یه دمنوش گرم (بابونه، به‌لیمو…)'],['🧘','۵ دقیقه کشش آروم بدن'],['📖','چند صفحه کتاب یا مطالعه‌ی سبک']];
const TIPS=[['💡','نور رو کم کن','نورای اضافه رو خاموش کن و اتاق رو کم‌نور کن.','#FFB020'],['❄️','دمای اتاق','کمی خنک، حدود ۱۸ تا ۲۰ درجه، برای خواب راحت‌تر.','#3DA9FC'],['🔋','گوشی رو شارژ بذار','تا صبح باتری داشته باشی و تماس شبانه قطع نشه.','#2EC4A0'],['🛏','تخت و پتو','پتو و بالشت رو راحت کن تا خوابیدن لذت‌بخش بشه.','#B48CF0']];
SF.push('nr');
const arr=d=>{if(!Array.isArray(d.nr)||d.nr.length!==NR.length)d.nr=NR.map((_,i)=>d.nr&&d.nr[i]?1:0);return d.nr};
const nrCard=d=>{const a=arr(d),n=a.filter(Boolean).length,all=n===NR.length;
return `<div class="card nrc"><h2>🌙 روتین شب <small>${fa(n)}/${fa(NR.length)}</small></h2><div class="nrbar"><i style="width:${n/NR.length*100}%"></i></div>${NR.map((r,i)=>`<div class="row nrr ${a[i]?'done':''}" data-a="nr" data-i="${i}"><span class="dot">${CK}</span><span class="nre">${r[0]}</span><span class="lb">${r[1]}</span></div>`).join('')}${all?`<div class="nrdone"><span>✦</span><b>روتین امشب کامل شد</b><small>حالا آماده‌ای برای یه خواب آروم، کنار هم 💞</small></div>`:''}</div>`};
const tipsCard=()=>`<div class="card tpc"><h2>✨ توصیه‌های قبل خواب<small>فقط توصیه</small></h2><div class="tps">${TIPS.map(t=>`<div class="tp" style="--t:${t[3]}"><i>${t[0]}</i><b>${t[1]}</b><small>${t[2]}</small></div>`).join('')}</div></div>`;
const _n=night,M='<div class="card"><h2>حال امروزت چطور بود؟</h2>';
night=function(){const h=_n(),d=D(),i=h.indexOf(M);return i<0?h:h.slice(0,i)+nrCard(d)+tipsCard()+h.slice(i)};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a="nr"]');if(!t)return;const a=arr(D()),i=+t.dataset.i;a[i]=a[i]?0:1;save();if(a[i]){burst(e.clientX,e.clientY);if(a.every(Boolean))for(let k=0;k<6;k++)setTimeout(()=>burst(innerWidth*(.2+k*.12),innerHeight*.3),k*130)}},true);
})();
</script>
